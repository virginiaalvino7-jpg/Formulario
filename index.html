<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto UATV / UTIM</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #eef3f7;
            color: #333;
        }

        header {
            background: #123c5a;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin-bottom: 0;
        }

        .contenedor {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .formulario,
        .mapa {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.10);
        }

        h2 {
            color: #123c5a;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #bbb;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            height: 110px;
            resize: none;
        }

        .captcha {
            margin-top: 20px;
            padding: 15px;
            background: #f0f5f8;
            border-radius: 10px;
        }

        #captchaCanvas {
            width: 100%;
            height: 80px;
            border-radius: 8px;
            border: 1px solid #aaa;
            background: #eeeeee;
            margin: 10px 0;
            display: block;
        }

        .captcha input {
            margin-top: 5px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #25D366;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1ebe5d;
        }

        .nuevoCaptcha {
            background: #123c5a;
            margin-top: 10px;
        }

        .nuevoCaptcha:hover {
            background: #0b2d45;
        }

        iframe {
            width: 100%;
            height: 430px;
            border: 0;
            border-radius: 10px;
        }

        .ubicacion {
            color: #555;
        }

        @media (max-width: 750px) {
            .contenedor {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>UATV / UTIM</h1>
        <p>Formulario de contacto</p>
    </header>

    <div class="contenedor">
        <div class="formulario">
            <h2>Contáctanos</h2>

            <form id="formulario">

                <label>Nombre:</label>
                <input
                    type="text"
                    id="nombre"
                    placeholder="Escribe tu nombre"
                    required
                >

                <label>Teléfono:</label>
                <input
                    type="tel"
                    id="telefono"
                    placeholder="Escribe tu teléfono"
                    maxlength="10"
                    inputmode="numeric"
                    required
                >

                <label>Correo:</label>
                <input
                    type="email"
                    id="correo"
                    placeholder="ejemplo@gmail.com"
                    required
                >

                <label>Comentario:</label>
                <textarea
                    id="comentario"
                    placeholder="Escribe tu comentario..."
                    required
                ></textarea>

                <div class="captcha">

                    <strong>
                        🛡️ Verificación de seguridad
                    </strong>

                    <p>
                        Escribe los caracteres que aparecen:
                    </p>

                    <canvas
                        id="captchaCanvas"
                        width="500"
                        height="100">
                    </canvas>

                    <input
                        type="text"
                        id="respuesta"
                        placeholder="Escribe el código"
                        autocomplete="off"
                        required
                    >

                    <button
                        type="button"
                        class="nuevoCaptcha"
                        onclick="crearCaptcha()">
                        🔄 Generar otro código
                    </button>

                </div>

                <button type="submit">
                    📱 Enviar por WhatsApp
                </button>

            </form>

        </div>

        <div class="mapa">

            <h2>
                📍 Nuestra ubicación
            </h2>

            <p class="ubicacion">
                UATV / UTIM
                <br>
                Tulcingo de Valle, Puebla
            </p>

            <iframe
                src="https://www.google.com/maps?q=Tulcingo%20de%20Valle%2C%20Puebla&output=embed"
                allowfullscreen=""
                loading="lazy">
            </iframe>

        </div>

    </div>

    <script>

        let captcha = "";

        function crearCaptcha() {

            let canvas = document.getElementById("captchaCanvas");

            let ctx = canvas.getContext("2d");

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            ctx.fillStyle = "#eeeeee";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            let caracteres =
                "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

            captcha = "";

            for (let i = 0; i < 6; i++) {

                captcha += caracteres.charAt(
                    Math.floor(
                        Math.random() * caracteres.length
                    )
                );

            }

            for (let i = 0; i < 8; i++) {

                ctx.beginPath();

                ctx.moveTo(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height
                );

                ctx.lineTo(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height
                );

                ctx.strokeStyle = "#777777";

                ctx.lineWidth = 1;

                ctx.stroke();
            }

            for (let i = 0; i < captcha.length; i++) {

                let tamaño =
                    30 + Math.random() * 10;

                let x =
                    45 + (i * 70);

                let y =
                    55 + Math.random() * 15;

                let angulo =
                    (Math.random() - 0.5) * 0.5;

                ctx.save();

                ctx.translate(x, y);

                ctx.rotate(angulo);

                ctx.font =
                    "bold " + tamaño + "px Arial";

                ctx.fillStyle =
                    "#123c5a";

                ctx.fillText(
                    captcha[i],
                    0,
                    0
                );

                ctx.restore();
            }

            for (let i = 0; i < 40; i++) {

                ctx.beginPath();

                ctx.arc(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height,
                    1.5,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle = "#555555";

                ctx.fill();
            }
        }

        crearCaptcha();

        document
            .getElementById("telefono")
            .addEventListener("input", function() {

                this.value =
                    this.value.replace(/\D/g, "");

                this.value =
                    this.value.substring(0, 10);

            });

        document
            .getElementById("formulario")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                let nombre =
                    document.getElementById("nombre").value;

                let telefono =
                    document.getElementById("telefono").value;

                let correo =
                    document.getElementById("correo").value;

                let comentario =
                    document.getElementById("comentario").value;

                let respuesta =
                    document.getElementById("respuesta").value;

                if (
                    respuesta.trim().toUpperCase() !== captcha
                ) {

                    alert(
                        "❌ CAPTCHA incorrecto. Intenta nuevamente."
                    );

                    crearCaptcha();

                    document.getElementById("respuesta").value = "";

                    return;
                }

                let numeroWhatsApp =
                    "522751082518";

                let mensaje =
                    "Hola, tengo una consulta sobre UATV / UTIM.\n\n" +
                    "👤 Nombre: " + nombre + "\n" +
                    "📱 Teléfono: " + telefono + "\n" +
                    "📧 Correo: " + correo + "\n\n" +
                    "💬 Comentario:\n" +
                    comentario;

                let url =
                    "https://wa.me/" +
                    numeroWhatsApp +
                    "?text=" +
                    encodeURIComponent(mensaje);

                window.open(
                    url,
                    "_blank"
                );
                document.getElementById("formulario").reset();
                crearCaptcha();

            });

    </script>

</body>
</html>
